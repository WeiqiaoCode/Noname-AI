name: Test Release Package

on:
  pull_request:
    paths:
      - ".github/workflows/release-test.yml"
      - "build/verify_release_package.mjs"
      - "js/config/version.js"
      - "info.json"
      - "package.json"
      - "logs/**"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-test.yml"
      - "build/verify_release_package.mjs"
      - "js/config/version.js"
      - "info.json"
      - "package.json"

permissions:
  contents: read

jobs:
  package:
    name: Build test package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      asset: ${{ steps.version.outputs.asset }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node --input-type=module -e "import { VERSION_SEMVER } from './js/config/version.js'; process.stdout.write(VERSION_SEMVER)")"
          DISPLAY_VERSION="$(node --input-type=module -e "import { VERSION } from './js/config/version.js'; process.stdout.write(VERSION)")"

          if [[ -z "$VERSION" || -z "$DISPLAY_VERSION" ]]; then
            echo "Version source returned an empty value."
            exit 1
          fi

          if [[ "$VERSION" != *-test ]]; then
            echo "Test release workflow only accepts *-test versions. Got: $VERSION"
            exit 1
          fi

          if [[ "$DISPLAY_VERSION" != "$VERSION" ]]; then
            echo "VERSION and VERSION_SEMVER must match for test releases."
            echo "VERSION=$DISPLAY_VERSION"
            echo "VERSION_SEMVER=$VERSION"
            exit 1
          fi

          INFO_VERSION="$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('info.json','utf8')); process.stdout.write(String(x.version||''))")"
          PACKAGE_VERSION="$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('package.json','utf8')); process.stdout.write(String(x.version||''))")"

          if [[ "$INFO_VERSION" != "$VERSION" || "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "Version mismatch:"
            echo "version.js=$VERSION"
            echo "info.json=$INFO_VERSION"
            echo "package.json=$PACKAGE_VERSION"
            exit 1
          fi

          ASSET="UnknownAI_${VERSION}.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "Packaging test version: $VERSION"

      - name: Run release gate
        run: npm test

      - name: Build and audit extension package
        shell: bash
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p "dist/无名AI"

          for item in extension.js info.json js score css assets data logs README.md CHANGELOG.md LICENSE; do
            if [[ ! -e "$item" ]]; then
              echo "Required release item is missing: $item"
              exit 1
            fi
            cp -R "$item" "dist/无名AI/"
          done

          node build/verify_release_package.mjs "dist/无名AI"

          (
            cd dist
            zip -q -r "../$ASSET" "无名AI"
          )

          test -s "$ASSET"

          unzip -Z1 "$ASSET" > package-files.txt
          grep -q '^无名AI/extension.js$' package-files.txt
          grep -q '^无名AI/info.json$' package-files.txt
          grep -q '^无名AI/js/' package-files.txt
          grep -q '^无名AI/score/' package-files.txt
          grep -q '^无名AI/logs/今日修改日志.js$' package-files.txt
          grep -q '^无名AI/logs/WORK_TRAIL.js$' package-files.txt

          if grep -Eq '^无名AI/(\.github|tests|build|DEV_GUIDE)/' package-files.txt; then
            echo "Development-only files leaked into release package."
            exit 1
          fi

          echo "Package ready: $ASSET"
          du -h "$ASSET"
          echo "Files: $(wc -l < package-files.txt)"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnknownAI-${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.asset }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged ZIP
        uses: actions/download-artifact@v4
        with:
          name: UnknownAI-${{ needs.package.outputs.version }}

      - name: Create or reuse test pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
          ASSET: ${{ needs.package.outputs.asset }}
        run: |
          set -euo pipefail

          TAG="v$VERSION"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi

          cat > release-notes.md <<EOF
          ## 无名AI $VERSION 测试版

          这是底层决策架构调整后的实战测试版本，当前阶段以发现和修复 P0 / P1 问题为主。

          ### 安装

          1. 下载 **$ASSET**
          2. 解压后得到 **无名AI** 文件夹
          3. 将该文件夹放入无名杀的 extension/ 目录，覆盖旧版本前建议先备份
          4. 完全重启无名杀
          5. 控制台执行 DJSC.VERSION，应显示 $VERSION

          ### 本版修复

          - 新增 Victory Objective / Role Objective / Strategic Intent 统一战略层
          - 忠臣主公濒危时进入 PROTECT CRITICAL，不再只是普通 +bonus
          - 反贼主公斩杀窗口进入 FINISH_LORD CRITICAL，普通阶段仍保持 utility-first FOCUS
          - 内奸身份固定、stance动态：中期 BALANCE/CONCEAL，最终主内残局 FINAL_DUEL
          - 身份槽位已排除敌方可能的 unknown 进入 PROTECTED_UNKNOWN，不作为普通集火目标
          - Strategic Intent 不修改 raw score；只在明确关键职责下提升 policy tier
          - 同回合 Intent 稳定复用，关键血线/人数/身份后验/目标状态变化时刷新
          - Decision Trace 与 Top-N quality snapshot 增加战略目标、Intent 与 alignment
          - #36 质量基线增加 strategy 维度和 strategic_intent 固定场景
          - 不引入武将画像、不改 Planner 搜索算法、不改 Guard

          ### 测试重点

          - 身份判断与敌我关系
          - 桃 / 无懈 / 铁索
          - 乐、兵、顺、拆的连续动作一致性
          - AOE 与残局策略
          - 多目标 / 多阶段技能决策
          - 卡死、报错、无限循环等 P0 问题

          自动化 release gate 与 release package dependency audit 已在发布前执行通过。
          EOF

          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "无名AI $VERSION 测试版" \
            --notes-file release-notes.md \
            --prerelease
